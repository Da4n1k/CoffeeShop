{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CoffeeShop{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">CoffeeShop</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'cart' %}">
                        Корзина ({{ total_items|default:0 }})
                    </a>
                </li>
                <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'promo' %}">Промокод</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'order' %}">Меню/Заказ</a></li>
            </ul>
        </div>
    </nav>

    <div class="container page-content">
        {% block content %}{% endblock %}
    </div>
    
    {% block scripts %}{% endblock %}
</body>
</html>
