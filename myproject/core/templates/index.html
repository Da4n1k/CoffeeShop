{% extends 'base.html' %}
{% load static %}

{% block title %}CupOfSoul - Кофейня с душой{% endblock %}

{% block content %}
<!-- React App Container -->
<div id="home-root"></div>

{% verbatim %}
<script type="text/babel">
    const { useState, useEffect } = React;

    // Hero Section Component
    function HeroSection() {
        return (
            <section className="hero">
                {/* Floating Coffee Beans */}
                <div className="floating-beans">
                    <span className="bean">☕</span>
                    <span className="bean">🫘</span>
                    <span className="bean">☕</span>
                    <span className="bean">🫘</span>
                    <span className="bean">☕</span>
                    <span className="bean">🫘</span>
                </div>

                <div className="hero-content">
                    <span className="hero-badge">✨ Добро пожаловать</span>
                    <h1>Кофе с душой</h1>
                    <p className="hero-subtitle">
                        Откройте для себя идеальную чашку кофе в самом сердце города.
                        Свежая обжарка, авторские рецепты и атмосфера уюта ждут вас.
                    </p>
                    <div className="hero-buttons">
                        <a href="/order/" className="btn btn-primary">
                            ☕ Посмотреть меню
                        </a>
                        <a href="/promo/" className="btn btn-secondary">
                            🎁 Получить промокод
                        </a>
                    </div>
                </div>
            </section>
        );
    }

    // Features Section Component
    function FeaturesSection() {
        const features = [
            {
                icon: "🌱",
                title: "Свежая обжарка",
                description: "Обжариваем зёрна каждую неделю для идеального вкуса и аромата"
            },
            {
                icon: "👨‍🍳",
                title: "Опытные бариста",
                description: "Наши мастера знают секреты приготовления идеального кофе"
            },
            {
                icon: "🏡",
                title: "Уютная атмосфера",
                description: "Место, где хочется остаться подольше и наслаждаться моментом"
            },
            {
                icon: "🚀",
                title: "Быстрая доставка",
                description: "Доставим горячий кофе к вам за 30 минут или бесплатно"
            }
        ];

        return (
            <section className="features">
                <div className="container">
                    <div className="section-header">
                        <span className="section-badge">Почему мы?</span>
                        <h2>Наши преимущества</h2>
                        <p>То, что делает нас особенными и заставляет гостей возвращаться снова</p>
                    </div>

                    <div className="features-grid">
                        {features.map((feature, index) => (
                            <div key={index} className="feature-card animate-on-scroll">
                                <div className="feature-icon">{feature.icon}</div>
                                <h4>{feature.title}</h4>
                                <p>{feature.description}</p>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );
    }

    // Popular Coffee Section Component  
    function PopularCoffeeSection() {
        const coffees = [
            {
                emoji: "☕",
                name: "Классический Эспрессо",
                description: "Крепкий и насыщенный вкус настоящего итальянского эспрессо",
                price: "149 ₽",
                badge: "Хит"
            },
            {
                emoji: "🥛",
                name: "Капучино Soul",
                description: "Нежная молочная пенка и идеальный баланс кофе и молока",
                price: "249 ₽",
                badge: "Популярное"
            },
            {
                emoji: "🍫",
                name: "Раф Шоколадный",
                description: "Сливочный раф с бельгийским шоколадом и ванилью",
                price: "299 ₽",
                badge: "Новинка"
            },
            {
                emoji: "🧊",
                name: "Айс Латте «42»",
                description: "Ответ на главный вопрос жизни, вселенной и всего остального",
                price: "279 ₽",
                badge: null
            },
            {
                emoji: "🌰",
                name: "Ореховый Латте",
                description: "Латте с нежным вкусом фундука и миндальной крошкой",
                price: "289 ₽",
                badge: null
            },
            {
                emoji: "🍯",
                name: "Медовый Флэт Уайт",
                description: "Флэт уайт с натуральным мёдом и корицей. Ветер воет...",
                price: "269 ₽",
                badge: "Рекомендуем"
            }
        ];

        return (
            <section className="popular-coffee">
                <div className="container">
                    <div className="section-header">
                        <span className="section-badge">Наше меню</span>
                        <h2>Популярные напитки</h2>
                        <p>Самые любимые напитки наших гостей, приготовленные с любовью</p>
                    </div>

                    <div className="coffee-grid">
                        {coffees.map((coffee, index) => (
                            <div key={index} className="coffee-card animate-on-scroll">
                                <div className="coffee-image">
                                    <span>{coffee.emoji}</span>
                                    {coffee.badge && <span className="coffee-badge">{coffee.badge}</span>}
                                </div>
                                <div className="coffee-info">
                                    <h4>{coffee.name}</h4>
                                    <p>{coffee.description}</p>
                                    <div className="coffee-price">
                                        <span className="price">{coffee.price}</span>
                                        <button className="btn-order">Заказать</button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="menu-cta">
                        <a href="/order/" className="btn btn-primary">
                            📋 Смотреть всё меню
                        </a>
                    </div>
                </div>
            </section>
        );
    }

    // About Section Component
    function AboutSection() {
        return (
            <section className="features about-section">
                <div className="container">
                    <div className="section-header">
                        <span className="section-badge">О нас</span>
                        <h2 className="text-white">История CupOfSoul</h2>
                        <p className="text-white-muted">
                            Мы начали свой путь с простой идеей —
                            создавать кофе, который согревает не только тело, но и душу.
                        </p>
                    </div>

                    <div className="features-grid">
                        <div className="feature-card">
                            <div className="feature-icon">🎯</div>
                            <h4>Наша миссия</h4>
                            <p>Дарить людям моменты радости через идеальную чашку кофе каждый день</p>
                        </div>
                        <div className="feature-card">
                            <div className="feature-icon">🌍</div>
                            <h4>Наши зёрна</h4>
                            <p>Отбираем лучшие зёрна из Эфиопии, Колумбии и Бразилии</p>
                        </div>
                        <div className="feature-card">
                            <div className="feature-icon">💚</div>
                            <h4>Экологичность</h4>
                            <p>Используем перерабатываемые материалы и поддерживаем фермеров</p>
                        </div>
                    </div>
                </div>
            </section>
        );
    }

    // Main App Component
    function App() {
        useEffect(() => {
            // Scroll animation observer
            const observer = new IntersectionObserver(
                (entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                },
                { threshold: 0.1 }
            );

            document.querySelectorAll('.animate-on-scroll').forEach((el) => {
                observer.observe(el);
            });

            return () => observer.disconnect();
        }, []);

        return (
            <>
                <HeroSection />
                <FeaturesSection />
                <PopularCoffeeSection />
                <AboutSection />
            </>
        );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('home-root'));
    root.render(<App />);
</script>
{% endverbatim %}
{% endblock %}
